<text x="1190" y="720" text-anchor="middle" class="small">20-neighbor local PCA</text>
<text x="1190" y="775" text-anchor="middle" class="title">median = 15</text>
<text x="1190" y="820" text-anchor="middle" class="label">IQR = 15–15</text>
<text x="1190" y="860" text-anchor="middle" class="small">20-neighbor centered rank cap = 19</text>
<text x="1190" y="890" text-anchor="middle" class="tiny">Scale- and sample-size-conditioned; not an intrinsic-dimension estimate</text>
<line x1="60" y1="980" x2="1540" y2="980" class="axis"/>
<text x="800" y="1025" text-anchor="middle" class="title">nonlinear structure ≠ validated nonlinear-model advantage</text>
<text x="800" y="1065" text-anchor="middle" class="label">PCA retained as the practical latent baseline under the tested identity-disjoint, multiplicity-controlled comparison</text>
<text x="800" y="1110" text-anchor="middle" class="small">Claim boundary: PCA is not asserted to be universally superior, and AE/VAE non-superiority is not interpreted as proof that garment morphology is globally linear.</text>
