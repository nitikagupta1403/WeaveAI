<text x="60" y="620" class="panel">C  Nonlinear predictive structure was nevertheless detectable</text>
<rect x="80" y="665" width="690" height="250" rx="10" class="soft"/>
<text x="425" y="710" text-anchor="middle" class="label">Fixed quadratic pairwise-coordinate audit</text>
<text x="425" y="765" text-anchor="middle" class="title">1 FWER-supported relation</text>
<text x="425" y="815" text-anchor="middle" class="label">strongest mean ΔR² = +0.432042</text>
<text x="425" y="860" text-anchor="middle" class="small">Interpretation: pairwise nonlinear predictability</text>
<text x="425" y="888" text-anchor="middle" class="small">Not evidence by itself for manifold curvature or nonlinear-encoder necessity</text>
<text x="850" y="620" class="panel">D  Local dimensionality diagnostic is descriptive only</text>
